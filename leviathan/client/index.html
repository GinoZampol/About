<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Leviathan</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e12; color: #e8e6df; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 12px; top: 10px; text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none; }
  #help { position: fixed; right: 12px; top: 10px; text-align: right; text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none; opacity: .85; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0e12; gap: 14px; z-index: 5; }
  #loading h1 { font: 600 28px/1 Georgia, serif; letter-spacing: .2em; margin: 0; }
  #bar { width: 260px; height: 3px; background: #232a33; } #bar div { height: 100%; width: 0; background: #c8b68a; transition: width .2s; }
  #map { position: fixed; right: 12px; bottom: 12px; width: min(42vh, 44vw); aspect-ratio: 1; border: 1px solid #0008; display: none; cursor: crosshair; image-rendering: auto; }
  #places { position: fixed; left: 12px; bottom: 12px; display: none; flex-direction: column; gap: 3px; max-height: 60vh; overflow: auto; }
  #places button { font: inherit; color: inherit; background: #0b0e12cc; border: 1px solid #ffffff22; padding: 3px 8px; text-align: left; cursor: pointer; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff8; pointer-events: none; }
  .noui #hud, .noui #help, .noui #cross { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div><div id="help"></div><div id="cross"></div>
<canvas id="map" width="512" height="512"></canvas><div id="places"></div>
<div id="loading"><h1>THE LEVIATHAN</h1><div id="bar"><div></div></div><div id="lmsg">loading world</div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
