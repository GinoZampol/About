<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,'Liberation Sans',sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.chart{position:absolute;left:50px;right:50px;top:690px;display:flex;gap:30px}
.panel{flex:1;display:flex;flex-direction:column;align-items:center}
.bars{height:760px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:28px;position:relative}
.bw{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:210px}
.bar{width:100%}.val{font-weight:900;font-size:76px;line-height:1;margin-bottom:8px}
.lab{position:absolute;bottom:-62px;font-weight:900;font-size:40px;letter-spacing:2px}
.mag{position:absolute;width:290px;height:290px;left:50%;top:50%;margin-left:-125px;transform:translateY(-175px) rotate(-8deg);pointer-events:none}
.bw.bad .mag{bottom:auto}
.foot{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-size:26px;font-weight:600;opacity:.65}
.stage{background:#fbf6e6;background-image:linear-gradient(#9ec9ee66 2px,transparent 2px),linear-gradient(90deg,#9ec9ee44 2px,transparent 2px);background-size:60px 60px}
.stage:before{content:"";position:absolute;left:90px;top:0;bottom:0;width:4px;background:#ff6b6b99}
h1{position:absolute;top:90px;left:110px;right:50px;font-weight:900;font-size:176px;line-height:.88;color:#111;letter-spacing:-6px;transform:rotate(-3deg);filter:url(#rough)}
h1 span{background:linear-gradient(transparent 62%,#ffe14d 62% 92%,transparent 92%);padding:0 8px}
h2{position:absolute;top:490px;left:110px;right:60px;font-weight:800;font-size:54px;color:#2b4bff;transform:rotate(-1.5deg);filter:url(#rough)}
.chart{filter:url(#rough)}
.ptitle{font-weight:900;font-size:42px;text-align:center;color:#111;line-height:1.05;height:88px}
.psub{font-size:28px;font-weight:700;color:#555;margin-bottom:12px;height:34px;font-style:italic}
.val{color:#111}.lab{color:#111}
.bar{border:8px solid #111;border-bottom:0;border-radius:6px 6px 0 0}
.bad .bar{background:repeating-linear-gradient(-45deg,#ff4d4d 0 14px,#ff8a8a 14px 26px)}
.good .bar{background:repeating-linear-gradient(-45deg,#33c26b 0 14px,#7fe3a3 14px 26px)}
.bars:after{content:"";position:absolute;left:-10px;right:-10px;bottom:-4px;height:8px;background:#111;border-radius:4px}
.panel.eu .ptitle:after{content:" ✓";color:#1faa59}
.arrow{position:absolute;right:70px;top:1500px;font-weight:900;font-size:52px;color:#e0262b;transform:rotate(-6deg);filter:url(#rough);text-align:center;line-height:1.05}
.foot{color:#111;font-style:italic}</style></head><body><svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter></svg><div class="stage"><h1>ALL BAD?? <span>look closer</span></h1><h2>↓ same story, but with receipts</h2>
<div class="chart"><div class="panel pre">
  <div class="ptitle">Pre-colonial<br>Africa</div><div class="psub">before</div>
  <div class="bars">
    <div class="bw bad"><div class="val">22%</div><div class="bar" style="height:220px"></div><div class="lab">BAD</div></div>
    <div class="bw good"><div class="val">27%</div><div class="bar" style="height:270px"></div><div class="lab">GOOD</div></div>
  </div></div><div class="panel eu">
  <div class="ptitle">European<br>colonialism</div><div class="psub">after</div>
  <div class="bars">
    <div class="bw bad"><div class="val">12%</div><div class="bar" style="height:120px"></div><svg class="mag" viewBox="0 0 300 300" filter="url(#rough)">
<circle cx="115" cy="115" r="85" fill="rgba(255,255,255,.55)" stroke="#111" stroke-width="14"/>
<path d="M62 85 A60 60 0 0 1 100 52" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/>
<line x1="178" y1="178" x2="270" y2="270" stroke="#111" stroke-width="26" stroke-linecap="round"/></svg><div class="lab">BAD</div></div>
    <div class="bw good"><div class="val">65%</div><div class="bar" style="height:650px"></div><div class="lab">GOOD</div></div>
  </div></div></div>
<div class="foot">illustrative figures · bad vs good outcomes</div></div></body></html>
