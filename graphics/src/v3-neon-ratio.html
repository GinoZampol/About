<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,'Liberation Sans',sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.chart{position:absolute;left:50px;right:50px;top:690px;display:flex;gap:30px}
.panel{flex:1;display:flex;flex-direction:column;align-items:center}
.bars{height:760px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:28px;position:relative}
.bw{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:210px}
.bar{width:100%}.val{font-weight:900;font-size:76px;line-height:1;margin-bottom:8px}
.lab{position:absolute;bottom:-62px;font-weight:900;font-size:40px;letter-spacing:2px}
.mag{position:absolute;width:290px;height:290px;left:50%;top:50%;margin-left:-125px;transform:translateY(-175px) rotate(-8deg);pointer-events:none}
.bw.bad .mag{bottom:auto}
.foot{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-size:26px;font-weight:600;opacity:.65}
.stage{background:radial-gradient(1200px 900px at 20% 0%,#3a1170 0%,transparent 60%),radial-gradient(1000px 900px at 100% 100%,#00425a 0%,transparent 60%),#07060f}
.kick{position:absolute;top:110px;left:60px;font-weight:800;font-size:36px;letter-spacing:10px;color:#00f0ff;text-transform:uppercase}
h1{position:absolute;top:175px;left:60px;right:60px;font-weight:900;font-size:124px;line-height:.92;letter-spacing:-4px;color:#fff;text-transform:uppercase;text-shadow:0 0 40px #b04dff}
h1 b{background:linear-gradient(90deg,#00f0ff,#ff2bd6);-webkit-background-clip:text;color:transparent;text-shadow:none}
h2{position:absolute;top:585px;left:60px;right:60px;font-weight:600;font-size:46px;color:#c9c4ff}
.panel{background:#ffffff0d;border:2px solid #ffffff24;border-radius:36px;padding:28px 10px 90px;backdrop-filter:blur(6px)}
.panel.eu{border-color:#00f0ff88;box-shadow:0 0 60px #00f0ff33}
.ptitle{color:#fff;font-weight:900;font-size:38px;text-align:center;text-transform:uppercase;line-height:1.05;height:82px}
.psub{color:#9a95d0;font-size:26px;font-weight:600;height:32px;margin-bottom:12px}
.val{color:#fff}.lab{color:#c9c4ff}
.bar{border-radius:18px 18px 4px 4px}
.bad .bar{background:linear-gradient(#ff5470,#a0102d);box-shadow:0 0 50px #ff2d55aa}
.good .bar{background:linear-gradient(#5dffa3,#00a85a);box-shadow:0 0 50px #00ff88aa}
.mag{filter:drop-shadow(0 0 18px #00f0ff)}
.foot{color:#fff}</style></head><body><svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter></svg><div class="stage"><div class="kick">Side by side</div><h1>The ratio <b>nobody</b> shows you</h1><h2>Bad vs good outcomes, before and after.</h2>
<div class="chart"><div class="panel pre">
  <div class="ptitle">Pre-colonial<br>Nigerian regimes</div><div class="psub">before</div>
  <div class="bars">
    <div class="bw bad"><div class="val">22%</div><div class="bar" style="height:220px"></div><div class="lab">BAD</div></div>
    <div class="bw good"><div class="val">27%</div><div class="bar" style="height:270px"></div><div class="lab">GOOD</div></div>
  </div></div><div class="panel eu">
  <div class="ptitle">European<br>colonialism</div><div class="psub">after</div>
  <div class="bars">
    <div class="bw bad"><div class="val">12%</div><div class="bar" style="height:120px"></div><svg class="mag" viewBox="0 0 300 300" >
<circle cx="115" cy="115" r="85" fill="rgba(0,240,255,.18)" stroke="#00f0ff" stroke-width="13"/>
<path d="M62 85 A60 60 0 0 1 100 52" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/>
<line x1="178" y1="178" x2="270" y2="270" stroke="#00f0ff" stroke-width="25" stroke-linecap="round"/></svg><div class="lab">BAD</div></div>
    <div class="bw good"><div class="val">65%</div><div class="bar" style="height:650px"></div><div class="lab">GOOD</div></div>
  </div></div></div>
<div class="foot">Illustrative figures · bad vs good outcomes</div></div></body></html>
