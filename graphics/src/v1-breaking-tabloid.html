<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,'Liberation Sans',sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.chart{position:absolute;left:50px;right:50px;top:690px;display:flex;gap:30px}
.panel{flex:1;display:flex;flex-direction:column;align-items:center}
.bars{height:760px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:28px;position:relative}
.bw{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:210px}
.bar{width:100%}.val{font-weight:900;font-size:76px;line-height:1;margin-bottom:8px}
.lab{position:absolute;bottom:-62px;font-weight:900;font-size:40px;letter-spacing:2px}
.mag{position:absolute;width:290px;height:290px;left:50%;top:50%;margin-left:-125px;transform:translateY(-175px) rotate(-8deg);pointer-events:none}
.bw.bad .mag{bottom:auto}
.foot{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-size:26px;font-weight:600;opacity:.65}
.stage{background:#0a0a0a}
.haz{position:absolute;left:0;right:0;height:56px;background:repeating-linear-gradient(-45deg,#ffd800 0 34px,#0a0a0a 34px 68px)}
.tag{position:absolute;top:100px;left:50px;background:#e10600;color:#fff;font-weight:900;font-size:44px;padding:8px 28px;letter-spacing:4px;transform:rotate(-2deg)}
h1{position:absolute;top:190px;left:50px;right:50px;color:#fff;font-weight:900;font-size:112px;line-height:.95;letter-spacing:-3px;text-transform:uppercase}
h1 em{font-style:normal;color:#ffd800}
h2{position:absolute;top:585px;left:50px;right:50px;color:#ffd800;font-weight:800;font-size:46px}
.ptitle{color:#fff;font-weight:900;font-size:40px;text-transform:uppercase;text-align:center;line-height:1.05;height:84px}
.psub{color:#aaa;font-size:26px;font-weight:600;margin-bottom:16px;height:32px}
.val{color:#fff}.lab{color:#fff}
.bad .bar{background:#e10600;box-shadow:0 0 40px #e1060088}.good .bar{background:#16d94a;box-shadow:0 0 40px #16d94a77}
.panel.eu{background:#1a1a1a;border:4px solid #ffd800;border-radius:20px;padding:20px 8px 90px}
.panel.pre{padding:24px 8px 90px}
.mag{filter:drop-shadow(0 8px 0 #000)}
.foot{color:#fff}</style></head><body><svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter></svg><div class="stage"><div class="haz" style="top:0"></div><div class="tag">BREAKING</div>
<h1>Colonialism was <em>all bad</em>… right?</h1><h2>Now look at the actual ratio 👀</h2>
<div class="chart"><div class="panel pre">
  <div class="ptitle">Pre-colonial<br>Nigerian regimes</div><div class="psub">before</div>
  <div class="bars">
    <div class="bw bad"><div class="val">22%</div><div class="bar" style="height:220px"></div><div class="lab">BAD</div></div>
    <div class="bw good"><div class="val">27%</div><div class="bar" style="height:270px"></div><div class="lab">GOOD</div></div>
  </div></div><div class="panel eu">
  <div class="ptitle">European<br>colonialism</div><div class="psub">after</div>
  <div class="bars">
    <div class="bw bad"><div class="val">12%</div><div class="bar" style="height:120px"></div><svg class="mag" viewBox="0 0 300 300" >
<circle cx="115" cy="115" r="85" fill="rgba(255,216,0,.25)" stroke="#ffd800" stroke-width="14"/>
<path d="M62 85 A60 60 0 0 1 100 52" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/>
<line x1="178" y1="178" x2="270" y2="270" stroke="#ffd800" stroke-width="26" stroke-linecap="round"/></svg><div class="lab">BAD</div></div>
    <div class="bw good"><div class="val">65%</div><div class="bar" style="height:650px"></div><div class="lab">GOOD</div></div>
  </div></div></div>
<div class="foot">Illustrative figures · bad vs good outcomes</div><div class="haz" style="bottom:0"></div></div></body></html>
